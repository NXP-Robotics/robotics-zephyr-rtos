# MCUboot doesn't need I2C/I3C/sensors
CONFIG_I2C=n
CONFIG_I3C=n
CONFIG_SENSOR=n

# Disable I3C workaround (pulls in USB CDC + I2C)
CONFIG_MCXN_T1_I3C_WORKAROUND=n

# Disable USB device stack — not needed in bootloader
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USBD_CDC_ACM_CLASS=n
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# Enable UART (pulls in lpflexcomm driver needed for MFD)
CONFIG_SERIAL=y
CONFIG_UART_MCUX_LPUART=y

# Enable MCUboot logging output
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
